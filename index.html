<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FuzzyMathGame｜自適應微積分學習遊戲</title>

    <!-- 網頁樣式 -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- KaTeX：數學公式排版 -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    >

    <!-- KaTeX 公式渲染程式 -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js">
    </script>
</head>

<body>

    <!-- ==================== 首頁 ==================== -->
    <section id="home-page" class="page">
        <div class="home-container">
            <h1>FuzzyMathGame</h1>

            <h2>基於 Fuzzy Logic 之自適應數學學習遊戲系統</h2>

            <p>
                透過解題、學習與難度調整，逐步挑戰微積分的不同章節。
            </p>

            <button type="button" onclick="showLevelPage()">
                開始遊戲
            </button>
        </div>
    </section>


    <!-- ==================== 章節選擇頁 ==================== -->
    <section id="level-page" class="page" style="display: none;">
        <div class="level-container">
            <h1>選擇挑戰章節</h1>

            <p>選擇想要學習的微積分章節。</p>

            <div class="level-grid">
                <button type="button" onclick="startGame(1)">
                    第一章<br>
                    函數與數學基礎
                </button>

                <button type="button" onclick="startGame(2)">
                    第二章<br>
                    極限
                </button>

                <button type="button" onclick="startGame(3)">
                    第三章<br>
                    連續性
                </button>

                <button type="button" onclick="startGame(4)">
                    第四章<br>
                    微分基本概念
                </button>

                <button type="button" onclick="startGame(5)">
                    第五章<br>
                    微分法則
                </button>

                <button type="button" onclick="startGame(6)">
                    第六章<br>
                    微分應用
                </button>

                <button type="button" onclick="startGame(7)">
                    第七章<br>
                    不定積分
                </button>

                <button type="button" onclick="startGame(8)">
                    第八章<br>
                    定積分與積分應用
                </button>
            </div>

            <button
                type="button"
                class="back-button"
                onclick="showHomePage()">
                返回首頁
            </button>
        </div>
    </section>


    <!-- ==================== 遊戲頁 ==================== -->
    <section id="game-page" class="page" style="display: none;">
        <div class="game-container">

            <!-- 遊戲狀態 -->
            <div class="game-header">
                <div class="game-status">
                    <span>剩餘時間：</span>
                    <span id="timer">90</span>
                    <span> 秒</span>
                </div>

                <div class="game-status">
                    <span>目前分數：</span>
                    <span id="score">50</span>
                </div>
            </div>

            <!-- 題目區 -->
            <section class="question-section">
                <h2>本次挑戰</h2>

                <div id="question-box" class="question-box">
                    題目載入中……
                </div>
            </section>

            <!-- 解題過程區 -->
            <section class="process-section">
                <h2>解題過程</h2>

                <p>
                    根據解題步驟完成空格，逐步解開題目。
                </p>

                <div id="process-box" class="process-box">
                    解題步驟載入中……
                </div>
            </section>

            <!-- 答題操作區 -->
            <section class="answer-section">
                <h2>輸入工具</h2>

                <p>
                    請先選取解題過程中的空格，再使用下方工具輸入答案。
                </p>

                <!-- 數字鍵盤 -->
                <div class="keyboard-section">
                    <h3>數字與運算符號</h3>

                    <div class="math-keyboard">
                        <button type="button" onclick="insertMath('7')">7</button>
                        <button type="button" onclick="insertMath('8')">8</button>
                        <button type="button" onclick="insertMath('9')">9</button>
                        <button type="button" onclick="insertMath('+')">+</button>
                        <button type="button" onclick="insertMath('-')">−</button>

                        <button type="button" onclick="insertMath('4')">4</button>
                        <button type="button" onclick="insertMath('5')">5</button>
                        <button type="button" onclick="insertMath('6')">6</button>
                        <button type="button" onclick="insertMath('*')">×</button>
                        <button type="button" onclick="insertMath('/')">÷</button>

                        <button type="button" onclick="insertMath('1')">1</button>
                        <button type="button" onclick="insertMath('2')">2</button>
                        <button type="button" onclick="insertMath('3')">3</button>
                        <button type="button" onclick="insertMath('(')">(</button>
                        <button type="button" onclick="insertMath(')')">)</button>

                        <button type="button" onclick="insertMath('0')">0</button>
                        <button type="button" onclick="insertMath('.')">.</button>
                        <button type="button" onclick="insertMath('x')">x</button>
                        <button type="button" onclick="insertMath('^')">次方</button>
                        <button type="button" onclick="backspaceMath()">⌫</button>
                    </div>
                </div>

                <!-- 數學符號鍵盤 -->
                <div class="keyboard-section">
                    <h3>數學符號</h3>

                    <div class="math-keyboard">
                        <button type="button" onclick="insertMath('=')">=</button>
                        <button type="button" onclick="insertMath('(')">(</button>
                        <button type="button" onclick="insertMath(')')">)</button>
                        <button type="button" onclick="insertMath('sqrt(')">√</button>
                        <button type="button" onclick="insertMath('pi')">π</button>
                    </div>
                </div>

                <!-- 分數與微積分符號 -->
                <div class="keyboard-section">
                    <h3>微積分符號</h3>

                    <div class="math-keyboard">
                        <button type="button" onclick="insertMath('frac')">分數</button>
                        <button type="button" onclick="insertMath('lim')">lim</button>
                        <button type="button" onclick="insertMath('dx')">dx</button>
                        <button type="button" onclick="insertMath('int')">∫</button>
                        <button type="button" onclick="insertMath('C')">+ C</button>
                    </div>
                </div>

                <!-- 操作按鈕 -->
                <div class="answer-actions">
                    <button
                        type="button"
                        onclick="checkAnswer()">
                        提交答案
                    </button>

                    <button
                        type="button"
                        class="back-button"
                        onclick="showLevelPage()">
                        返回章節選擇
                    </button>
                </div>

                <!-- 答題結果 -->
                <div
                    id="feedback"
                    class="feedback"
                    aria-live="polite">
                </div>
            </section>

        </div>
    </section>


    <!-- JavaScript：頁面操作、題目載入與答題邏輯 -->
    <script src="/static/js/main.js"></script>

</body>
</html>
